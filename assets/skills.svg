<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Technical Skills Arsenal">
<defs>
  <linearGradient id="skills-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050812"/>
    <stop offset="100%" stop-color="#0a0e1c"/>
  </linearGradient>
  <linearGradient id="pill-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#090d16"/>
  </linearGradient>
  <clipPath id="clip-skills">
    <rect width="1200" height="340" rx="20"/>
  </clipPath>
</defs>

<g clip-path="url(#clip-skills)">
  <!-- Solid Black Background: Zero white bleed in Light Mode -->
  <rect width="1200" height="340" fill="url(#skills-bg)"/>
  
  <!-- Subtle Header -->
  <g transform="translate(40, 24)">
    <text font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#00f0ff">TECHNICAL ARSENAL</text>
    <text x="0" y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#64748b">Battle-tested tools and frameworks utilized across 10+ live production platforms</text>
  </g>

  <!-- Category 1: Backend & Core PHP -->
  <g transform="translate(40, 80)">
    <rect width="260" height="230" rx="14" fill="#030712" stroke="#FF2D20" stroke-opacity="0.35" stroke-width="1.2"/>
    <!-- Card Title -->
    <rect width="260" height="36" rx="14" fill="#FF2D20" fill-opacity="0.12"/>
    <circle cx="20" cy="18" r="4" fill="#FF2D20"/>
    <text x="32" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#FF6B4A">BACKEND &amp; CORE</text>
    
    <!-- Skills Pills -->
    <g transform="translate(14, 52)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- PHP 8.x -->
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="19" fill="#f8fafc">PHP 8.x/7.4</text>
      <!-- Laravel -->
      <rect x="115" y="0" width="115" height="28" rx="6" fill="#FF2D20" fill-opacity="0.15" stroke="#FF2D20" stroke-opacity="0.5"/>
      <text x="127" y="19" fill="#ff8a7a">Laravel 12</text>
      <!-- CodeIgniter 4 -->
      <rect x="0" y="38" width="135" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="57" fill="#f8fafc">CodeIgniter 4</text>
      <!-- Core PHP -->
      <rect x="145" y="38" width="85" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="157" y="57" fill="#f8fafc">Core PHP</text>
      <!-- OOP & MVC -->
      <rect x="0" y="76" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="95" fill="#f8fafc">OOP / MVC</text>
      <!-- SOLID Principles -->
      <rect x="115" y="76" width="115" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="127" y="95" fill="#f8fafc">SOLID Code</text>
      <!-- Composer -->
      <rect x="0" y="114" width="95" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="133" fill="#f8fafc">Composer</text>
      <!-- Artisan CLI -->
      <rect x="105" y="114" width="125" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="117" y="133" fill="#f8fafc">Artisan CLI</text>
    </g>
  </g>

  <!-- Category 2: Database & Performance -->
  <g transform="translate(325, 80)">
    <rect width="260" height="230" rx="14" fill="#030712" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect width="260" height="36" rx="14" fill="#00f0ff" fill-opacity="0.12"/>
    <circle cx="20" cy="18" r="4" fill="#00f0ff"/>
    <text x="32" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#00f0ff">DATABASE &amp; DATA</text>
    
    <g transform="translate(14, 52)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- MySQL -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-opacity="0.5"/>
      <text x="12" y="19" fill="#38bdf8">MySQL</text>
      <!-- Query Optimization -->
      <rect x="95" y="0" width="135" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="107" y="19" fill="#f8fafc">Query Tuning</text>
      <!-- Schema Indexing -->
      <rect x="0" y="38" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="57" fill="#f8fafc">Index Optimization</text>
      <!-- Schema Design -->
      <rect x="155" y="38" width="75" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="167" y="57" fill="#f8fafc">Schema</text>
      <!-- Stored Procedures -->
      <rect x="0" y="76" width="140" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="95" fill="#f8fafc">Stored Procedures</text>
      <!-- Redis -->
      <rect x="150" y="76" width="80" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="162" y="95" fill="#f8fafc">Redis</text>
      <!-- MongoDB -->
      <rect x="0" y="114" width="95" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="133" fill="#f8fafc">MongoDB</text>
      <!-- phpMyAdmin -->
      <rect x="105" y="114" width="125" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="117" y="133" fill="#f8fafc">phpMyAdmin</text>
    </g>
  </g>

  <!-- Category 3: APIs, Payments & Security -->
  <g transform="translate(610, 80)">
    <rect width="260" height="230" rx="14" fill="#030712" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect width="260" height="36" rx="14" fill="#10b981" fill-opacity="0.12"/>
    <circle cx="20" cy="18" r="4" fill="#10b981"/>
    <text x="32" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#10b981">APIS &amp; SECURITY</text>
    
    <g transform="translate(14, 52)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- RESTful APIs -->
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="12" y="19" fill="#34d399">RESTful APIs</text>
      <!-- Razorpay -->
      <rect x="125" y="0" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="137" y="19" fill="#f8fafc">Razorpay</text>
      <!-- Govt APIs -->
      <rect x="0" y="38" width="95" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="57" fill="#f8fafc">Govt APIs</text>
      <!-- SMS Gateways -->
      <rect x="105" y="38" width="125" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="117" y="57" fill="#f8fafc">SMS Webhooks</text>
      <!-- Sanctum & JWT -->
      <rect x="0" y="76" width="120" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="95" fill="#f8fafc">Sanctum / JWT</text>
      <!-- RBAC -->
      <rect x="130" y="76" width="100" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="142" y="95" fill="#f8fafc">Multi-RBAC</text>
      <!-- SQLi/XSS Shield -->
      <rect x="0" y="114" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="133" fill="#f8fafc">SQLi/XSS Shield</text>
      <!-- Postman -->
      <rect x="155" y="114" width="75" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="167" y="133" fill="#f8fafc">Postman</text>
    </g>
  </g>

  <!-- Category 4: AI & Deployment Tools -->
  <g transform="translate(895, 80)">
    <rect width="265" height="230" rx="14" fill="#030712" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect width="265" height="36" rx="14" fill="#a855f7" fill-opacity="0.12"/>
    <circle cx="20" cy="18" r="4" fill="#a855f7"/>
    <text x="32" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#c084fc">AI &amp; WORKFLOW</text>
    
    <g transform="translate(14, 52)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- Claude.ai -->
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="12" y="19" fill="#c084fc">Claude 3.7</text>
      <!-- ChatGPT -->
      <rect x="115" y="0" width="120" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="127" y="19" fill="#f8fafc">ChatGPT AI</text>
      <!-- Vibe Coding -->
      <rect x="0" y="38" width="130" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="57" fill="#f8fafc">Vibe Coding ⚡</text>
      <!-- JavaScript & jQuery -->
      <rect x="140" y="38" width="95" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="152" y="57" fill="#f8fafc">JS / jQuery</text>
      <!-- Bootstrap & CSS -->
      <rect x="0" y="76" width="115" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="95" fill="#f8fafc">Bootstrap 5</text>
      <!-- Git & GitHub -->
      <rect x="125" y="76" width="110" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="137" y="95" fill="#f8fafc">Git / GitHub</text>
      <!-- Linux & Nginx -->
      <rect x="0" y="114" width="120" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="133" fill="#f8fafc">Linux / Nginx</text>
      <!-- cPanel / SSH -->
      <rect x="130" y="114" width="105" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.8"/>
      <text x="142" y="133" fill="#f8fafc">cPanel / SSH</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</g>
</svg>