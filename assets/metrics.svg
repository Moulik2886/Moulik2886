<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Impact and Delivery Metrics">
<defs>
  <linearGradient id="r0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2D20"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="r2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="r3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
  <linearGradient id="r4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  <linearGradient id="metrics-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050812"/>
    <stop offset="100%" stop-color="#090e1c"/>
  </linearGradient>
  <filter id="glow-m" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="metrics-clip">
    <rect width="1200" height="260" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#metrics-clip)">
  <!-- Solid Black Background -->
  <rect width="1200" height="260" fill="url(#metrics-bg)"/>
  
  <!-- Metric 1: 50% Traffic Increase -->
  <g transform="translate(120,95)">
    <circle r="50" fill="none" stroke="#172033" stroke-width="10"/>
    <circle r="50" fill="none" stroke="url(#r0)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.15" stroke-dashoffset="157.08" transform="rotate(-90)" filter="url(#glow-m)">
      <animate attributeName="stroke-dashoffset" values="314.15;157.08;157.08;314.15" keyTimes="0;.2;.9;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff">50%</text>
  </g>
  <text x="120" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Traffic surge handled</text>
  <text x="120" y="210" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#FF6B4A">LARAVEL / CI4 CACHING</text>

  <!-- Metric 2: 60% Faster AI Delivery -->
  <g transform="translate(360,95)">
    <circle r="50" fill="none" stroke="#172033" stroke-width="10"/>
    <circle r="50" fill="none" stroke="url(#r1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.15" stroke-dashoffset="125.66" transform="rotate(-90)" filter="url(#glow-m)">
      <animate attributeName="stroke-dashoffset" values="314.15;125.66;125.66;314.15" keyTimes="0;.2;.9;1" dur="8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <text y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff">60%</text>
  </g>
  <text x="360" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Faster AI delivery</text>
  <text x="360" y="210" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#c084fc">CLAUDE.AI &amp; CHATGPT</text>

  <!-- Metric 3: 40% Query Latency Cut -->
  <g transform="translate(600,95)">
    <circle r="50" fill="none" stroke="#172033" stroke-width="10"/>
    <circle r="50" fill="none" stroke="url(#r2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.15" stroke-dashoffset="188.49" transform="rotate(-90)" filter="url(#glow-m)">
      <animate attributeName="stroke-dashoffset" values="314.15;188.49;188.49;314.15" keyTimes="0;.2;.9;1" dur="8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff">40%</text>
  </g>
  <text x="600" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Query latency cut</text>
  <text x="600" y="210" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#00f0ff">MYSQL INDEX TUNING</text>

  <!-- Metric 4: 4+ Years Experience -->
  <g transform="translate(840,95)">
    <circle r="50" fill="none" stroke="#172033" stroke-width="10"/>
    <circle r="50" fill="none" stroke="url(#r3)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.15" stroke-dashoffset="62.83" transform="rotate(-90)" filter="url(#glow-m)">
      <animate attributeName="stroke-dashoffset" values="314.15;62.83;62.83;314.15" keyTimes="0;.2;.9;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff">4+</text>
  </g>
  <text x="840" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Years professional exp</text>
  <text x="840" y="210" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#10b981">SOFTWARE DEV + IT</text>

  <!-- Metric 5: 10+ Production Deployments -->
  <g transform="translate(1080,95)">
    <circle r="50" fill="none" stroke="#172033" stroke-width="10"/>
    <circle r="50" fill="none" stroke="url(#r4)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.15" stroke-dashoffset="0.0" transform="rotate(-90)" filter="url(#glow-m)">
      <animate attributeName="stroke-dashoffset" values="314.15;0.0;0.0;314.15" keyTimes="0;.2;.9;1" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="#ffffff">10+</text>
  </g>
  <text x="1080" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Live production platforms</text>
  <text x="1080" y="210" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#f59e0b">GOV-TECH &amp; ERP</text>

  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#253248" stroke-width="1.5"/>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>