<svg xmlns="http://www.w3.org/2000/svg" width="580" height="256" viewBox="0 0 580 256" role="img" aria-label="NCS DNH and DD Gateway">
<defs>
  <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050712"/>
    <stop offset="100%" stop-color="#0a0f22"/>
  </linearGradient>
  <linearGradient id="p2-accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <linearGradient id="p2-shimmer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="p2-clip">
    <rect width="580" height="256" rx="16"/>
  </clipPath>
</defs>

<g clip-path="url(#p2-clip)">
  <rect width="580" height="256" fill="url(#p2-bg)"/>
  
  <circle cx="530" cy="40" r="100" fill="#00f0ff" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <text x="548" y="70" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="900" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5">02</text>
  <text x="28" y="50" font-family="'Segoe UI', -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">NCS (MoLE) Integration Gateway</text>
  <text x="28" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#00f0ff">CENTRAL MINISTRY OF LABOUR &amp; EMPLOYMENT BRIDGE</text>
  
  <line x1="28" y1="90" x2="552" y2="90" stroke="url(#p2-accent)" stroke-width="1.8" stroke-opacity="0.7"/>

  <g transform="translate(28, 118)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#cbd5e1">
    <text y="0"><tspan fill="#00f0ff" font-weight="bold">▸</tspan> Partner SSO token exchange with secure HMAC encryption</text>
    <text y="28"><tspan fill="#00f0ff" font-weight="bold">▸</tspan> Automated candidate data sync to Central NCS repository</text>
    <text y="56"><tspan fill="#00f0ff" font-weight="bold">▸</tspan> Dynamic frontend for job-seekers with instant profile validation</text>
  </g>

  <g transform="translate(28, 204)">
    <rect x="0" y="0" width="65" height="26" rx="13" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-opacity="0.5"/>
    <text x="32" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#38bdf8">PHP</text>

    <rect x="75" y="0" width="105" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="127" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">REST APIs</text>

    <rect x="190" y="0" width="90" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="235" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">MoLE SSO</text>

    <rect x="290" y="0" width="85" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="332" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">jQuery</text>
  </g>

  <!-- Shimmer Beam -->
  <rect x="-200" y="0" width="120" height="256" fill="url(#p2-shimmer)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;750;750" keyTimes="0;.4;1" dur="7s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="100 900">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" begin="0.2s" repeatCount="indefinite"/>
</rect>
</svg>