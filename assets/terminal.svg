<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-label="Core Strengths and Architecture">
<defs>
  <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050811"/>
    <stop offset="100%" stop-color="#090d1a"/>
  </linearGradient>
  <linearGradient id="inner-card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0c1222"/>
    <stop offset="100%" stop-color="#080c18"/>
  </linearGradient>
  <linearGradient id="glow-red" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="100%" stop-color="#f43f5e"/>
  </linearGradient>
  <linearGradient id="glow-cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <linearGradient id="glow-purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>
  <clipPath id="clip-main">
    <rect width="1180" height="340" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#clip-main)">
  <!-- Solid Dark Background: Zero white bleed in Light Mode -->
  <rect width="1180" height="340" fill="url(#card-bg)"/>
  
  <!-- Top Bar -->
  <rect width="1180" height="46" fill="#0c1324"/>
  <circle cx="28" cy="23" r="6" fill="#ef4444"/>
  <circle cx="48" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="23" r="6" fill="#10b981"/>
  <text x="590" y="28" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#94a3b8">
    moulik-solanki :: core-engineering-architecture.php
  </text>

  <!-- 3 Pillar Columns -->
  <!-- Pillar 1: Backend Engineering -->
  <g transform="translate(30, 68)">
    <rect width="350" height="240" rx="12" fill="url(#inner-card-bg)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="350" height="42" rx="12" fill="#FF2D20" fill-opacity="0.12"/>
    <circle cx="24" cy="21" r="5" fill="#FF2D20"/>
    <text x="38" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#FF6B4A">BACKEND &amp; MVC</text>

    <!-- Card Points -->
    <g transform="translate(18, 64)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" fill="#cbd5e1">
      <text y="0"><tspan fill="#FF2D20">▹</tspan> Laravel 12, CodeIgniter 4 &amp; Core PHP</text>
      <text y="28"><tspan fill="#FF2D20">▹</tspan> Robust OOP, MVC &amp; SOLID Principles</text>
      <text y="56"><tspan fill="#FF2D20">▹</tspan> High-throughput RESTful API design</text>
      <text y="84"><tspan fill="#FF2D20">▹</tspan> Payment gateways (Razorpay, SBIePay)</text>
      <text y="112"><tspan fill="#FF2D20">▹</tspan> Secure Auth: Laravel Sanctum, JWT, RBAC</text>
      <text y="140"><tspan fill="#FF2D20">▹</tspan> SQLi, XSS &amp; CSRF protection built-in</text>
    </g>
  </g>

  <!-- Pillar 2: Database & Performance -->
  <g transform="translate(415, 68)">
    <rect width="350" height="240" rx="12" fill="url(#inner-card-bg)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="350" height="42" rx="12" fill="#00f0ff" fill-opacity="0.12"/>
    <circle cx="24" cy="21" r="5" fill="#00f0ff"/>
    <text x="38" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#00f0ff">DATABASE &amp; SCALE</text>

    <!-- Card Points -->
    <g transform="translate(18, 64)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" fill="#cbd5e1">
      <text y="0"><tspan fill="#00f0ff">▹</tspan> High-volume MySQL schema architecture</text>
      <text y="28"><tspan fill="#00f0ff">▹</tspan> Advanced query tuning, joins &amp; indexing</text>
      <text y="56"><tspan fill="#00f0ff">▹</tspan> 50% traffic surge handled (Labourdnhdd)</text>
      <text y="84"><tspan fill="#00f0ff">▹</tspan> Redis &amp; application-layer caching</text>
      <text y="112"><tspan fill="#00f0ff">▹</tspan> Multi-tenant business ERP (Shipwave)</text>
      <text y="140"><tspan fill="#00f0ff">▹</tspan> Live database backup &amp; automated sync</text>
    </g>
  </g>

  <!-- Pillar 3: AI Vibe Coding & Delivery -->
  <g transform="translate(800, 68)">
    <rect width="350" height="240" rx="12" fill="url(#inner-card-bg)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="350" height="42" rx="12" fill="#a855f7" fill-opacity="0.12"/>
    <circle cx="24" cy="21" r="5" fill="#a855f7"/>
    <text x="38" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#c084fc">AI &amp; RAPID DELIVERY</text>

    <!-- Card Points -->
    <g transform="translate(18, 64)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" fill="#cbd5e1">
      <text y="0"><tspan fill="#a855f7">▹</tspan> AI-assisted vibe coding: Claude &amp; ChatGPT</text>
      <text y="28"><tspan fill="#a855f7">▹</tspan> 60% faster code delivery &amp; prototyping</text>
      <text y="56"><tspan fill="#a855f7">▹</tspan> Systematic root-cause production debugging</text>
      <text y="84"><tspan fill="#a855f7">▹</tspan> Python &amp; PHP background automation</text>
      <text y="112"><tspan fill="#a855f7">▹</tspan> Apache, Nginx, cPanel &amp; SSH deployments</text>
      <text y="140"><tspan fill="#a855f7">▹</tspan> Agile sprints, code reviews &amp; Git flows</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1178" height="338" rx="17" fill="none" stroke="#253248" stroke-width="1.5"/>
</g>
</svg>