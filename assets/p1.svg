<svg xmlns="http://www.w3.org/2000/svg" width="580" height="256" viewBox="0 0 580 256" role="img" aria-label="Labourdnhdd - Digital Labour Compliance Portal">
<defs>
  <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050712"/>
    <stop offset="100%" stop-color="#0a0f22"/>
  </linearGradient>
  <linearGradient id="p1-accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>
  <linearGradient id="p1-shimmer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="p1-clip">
    <rect width="580" height="256" rx="16"/>
  </clipPath>
</defs>

<g clip-path="url(#p1-clip)">
  <!-- Solid Black Background -->
  <rect width="580" height="256" fill="url(#p1-bg)"/>
  
  <!-- Glowing Ambient Orb -->
  <circle cx="530" cy="40" r="100" fill="#FF2D20" opacity="0.15">
    <animate attributeName="opacity" values="0.10;0.25;0.10" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <text x="548" y="70" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="900" fill="none" stroke="#FF2D20" stroke-opacity="0.3" stroke-width="1.5">01</text>
  <text x="28" y="50" font-family="'Segoe UI', -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Labourdnhdd — Labour Portal</text>
  <text x="28" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#FF6B4A">GOVT OF DNH &amp; DD · SINGLE-WINDOW E-GOVERNANCE</text>
  
  <line x1="28" y1="90" x2="552" y2="90" stroke="url(#p1-accent)" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Bullets -->
  <g transform="translate(28, 118)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#cbd5e1">
    <text y="0"><tspan fill="#FF2D20" font-weight="bold">▸</tspan> Handled 50% traffic surge via query caching &amp; tuning</text>
    <text y="28"><tspan fill="#FF2D20" font-weight="bold">▸</tspan> Multi-step digital licensing replacing manual paperwork</text>
    <text y="56"><tspan fill="#FF2D20" font-weight="bold">▸</tspan> SBIePay payment gateway &amp; Cyber Treasury reconciliation</text>
  </g>

  <!-- Badges -->
  <g transform="translate(28, 204)">
    <rect x="0" y="0" width="85" height="26" rx="13" fill="#FF2D20" fill-opacity="0.15" stroke="#FF2D20" stroke-opacity="0.5"/>
    <text x="42" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#ff8a7a">Laravel</text>

    <rect x="95" y="0" width="115" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="152" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">CodeIgniter 4</text>

    <rect x="220" y="0" width="75" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="257" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">MySQL</text>

    <rect x="305" y="0" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="352" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">REST APIs</text>
  </g>

  <!-- Moving Shimmer Light Sweep -->
  <rect x="-200" y="0" width="120" height="256" fill="url(#p1-shimmer)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;750;750" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#FF2D20" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="100 900">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>