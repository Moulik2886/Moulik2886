    <stop offset="0%" stop-color="#050814"/>
    <stop offset="100%" stop-color="#0a1024"/>
  </linearGradient>
  <linearGradient id="side-accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
