<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28">
<defs>
  <linearGradient id="div-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20" stop-opacity="0"/>
    <stop offset="30%" stop-color="#FF2D20"/>
    <stop offset="50%" stop-color="#00f0ff"/>
    <stop offset="70%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="div-glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- Solid Black Background: Guarantees deep dark even in Light Mode -->
<rect width="1200" height="28" fill="#050812"/>

<!-- Glowing Divider Line -->
<rect x="50" y="13" width="1100" height="2" fill="url(#div-grad)" opacity="0.8"/>

<!-- Center Tech Diamond -->
<g transform="translate(600, 14)">
  <rect x="-6" y="-6" width="12" height="12" fill="#050812" stroke="#FF2D20" stroke-width="1.8">
    <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="10s" repeatCount="indefinite"/>
  </rect>
  <circle r="2.5" fill="#00f0ff"/>
</g>
</svg>