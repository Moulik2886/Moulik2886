<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Moulik Solanki GitHub Activity &amp; Development Velocity">
<defs>
  <linearGradient id="act-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#04060e"/>
    <stop offset="50%" stop-color="#050814"/>
    <stop offset="100%" stop-color="#080d1e"/>
  </linearGradient>

  <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="35%" stop-color="#38bdf8"/>
    <stop offset="70%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#FF2D20"/>
  </linearGradient>

  <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
    <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="shimmer-act" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <filter id="act-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="act-clip">
    <rect width="1200" height="340" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#act-clip)">
  <!-- Solid Black Background -->
  <rect width="1200" height="340" fill="url(#act-bg)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="250" cy="180" r="160" fill="#00f0ff" opacity="0.04"/>
  <circle cx="950" cy="160" r="180" fill="#FF2D20" opacity="0.04"/>

  <!-- Top Navigation & Header -->
  <g transform="translate(32, 34)">
    <!-- Live Recording Dot -->
    <circle cx="6" cy="6" r="5" fill="#FF2D20">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="6" r="9" fill="none" stroke="#FF2D20" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="5;12;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <text x="24" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#f8fafc">
      ENGINEERING ACTIVITY &amp; REPOSITORY VELOCITY
    </text>
    <text x="365" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#00f0ff" opacity="0.8">
      [31-DAY SPRINT CYCLE]
    </text>

    <!-- Top Right Status Badges -->
    <g transform="translate(860, -4)">
      <rect width="275" height="26" rx="13" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="15" cy="13" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
        STATUS: <tspan fill="#34d399" font-weight="600">CONTINUOUS PRODUCTION</tspan>
      </text>
    </g>
  </g>

  <!-- Horizontal Grid Divider -->
  <line x1="32" y1="62" x2="1168" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Y-Axis Grid Lines & Labels -->
  <g stroke="#1a2336" stroke-width="1" stroke-dasharray="4 4">
    <line x1="70" y1="100" x2="1140" y2="100"/>
    <line x1="70" y1="145" x2="1140" y2="145"/>
    <line x1="70" y1="190" x2="1140" y2="190"/>
    <line x1="70" y1="235" x2="1140" y2="235"/>
  </g>

  <!-- Y-Axis Values -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#475569" text-anchor="end">
    <text x="60" y="104">High</text>
    <text x="60" y="149">Med</text>
    <text x="60" y="194">Base</text>
    <text x="60" y="239">0</text>
  </g>

  <!-- Area Fill Path (Dynamic Wave Simulation) -->
  <path fill="url(#area-grad)" d="M80,235 L80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130 L1130,235 Z">
    <animate attributeName="d" values="
      M80,235 L80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130 L1130,235 Z;
      M80,235 L80,170 Q130,140 180,120 T280,150 T380,95 T480,125 T580,110 T680,115 T780,90 T880,125 T980,100 T1080,95 L1130,120 L1130,235 Z;
      M80,235 L80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130 L1130,235 Z"
      dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Main Animated Activity Stroke Line -->
  <path fill="none" stroke="url(#line-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#act-glow)"
    d="M80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130">
    <animate attributeName="d" values="
      M80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130;
      M80,170 Q130,140 180,120 T280,150 T380,95 T480,125 T580,110 T680,115 T780,90 T880,125 T980,100 T1080,95 L1130,120;
      M80,180 Q130,120 180,140 T280,170 T380,110 T480,135 T580,95 T680,130 T780,105 T880,140 T980,85 T1080,115 L1130,130"
      dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Pulsing Data Nodes / Peaks -->
  <g>
    <!-- Peak 1 -->
    <circle cx="180" cy="140" r="4" fill="#00f0ff">
      <animate attributeName="r" values="3.5;6;3.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="140" r="8" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;14;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Peak 2 -->
    <circle cx="380" cy="110" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Peak 3 (Main Peak) -->
    <circle cx="580" cy="95" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;7;4" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="95" r="10" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.7">
      <animate attributeName="r" values="5;16;5" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Peak 4 -->
    <circle cx="780" cy="105" r="4" fill="#a855f7">
      <animate attributeName="r" values="3.5;6;3.5" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Peak 5 (Release Peak) -->
    <circle cx="980" cy="85" r="5" fill="#FF2D20">
      <animate attributeName="r" values="4;7;4" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="85" r="10" fill="none" stroke="#FF2D20" stroke-width="1.2" opacity="0.7">
      <animate attributeName="r" values="5;16;5" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Peak 6 -->
    <circle cx="1080" cy="115" r="4" fill="#00f0ff">
      <animate attributeName="r" values="3.5;6;3.5" dur="2.9s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- X-Axis Timeline Labels -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="80" y="258">DAY 01</text>
    <text x="280" y="258">DAY 08</text>
    <text x="480" y="258">DAY 15</text>
    <text x="680" y="258">DAY 22</text>
    <text x="880" y="258">DAY 28</text>
    <text x="1080" y="258"><tspan fill="#00f0ff" font-weight="600">TODAY (LIVE)</tspan></text>
  </g>

  <!-- Bottom Metric Quick Indicators -->
  <g transform="translate(70, 280)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="230" height="36" rx="8" fill="#0b1120" stroke="#1e293b"/>
    <text x="16" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      COMMIT CADENCE: <tspan fill="#38bdf8" font-weight="700">AGGRESSIVE</tspan>
    </text>

    <!-- Metric 2 -->
    <rect x="250" y="0" width="240" height="36" rx="8" fill="#0b1120" stroke="#1e293b"/>
    <text x="266" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      MAIN FOCUS: <tspan fill="#FF2D20" font-weight="700">LARAVEL / CI4 / DB</tspan>
    </text>

    <!-- Metric 3 -->
    <rect x="510" y="0" width="250" height="36" rx="8" fill="#0b1120" stroke="#1e293b"/>
    <text x="526" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      CODE QUALITY: <tspan fill="#34d399" font-weight="700">STRICT ARCHITECTURE</tspan>
    </text>

    <!-- Metric 4 -->
    <rect x="780" y="0" width="280" height="36" rx="8" fill="#0b1120" stroke="#1e293b"/>
    <text x="796" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      DEPLOYMENT: <tspan fill="#00f0ff" font-weight="700">HIGH-UPTIME PRODUCTION</tspan>
    </text>
  </g>

  <!-- Shimmer Light Sweep -->
  <rect x="-300" y="0" width="200" height="340" fill="url(#shimmer-act)" transform="skewX(-20)">
    <animate attributeName="x" values="-300;1500;1500" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>
