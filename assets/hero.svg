<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Moulik Solanki - Laravel PHP Developer">
<defs>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070f"/>
    <stop offset="45%" stop-color="#0a0f1d"/>
    <stop offset="100%" stop-color="#120a1c"/>
  </linearGradient>
  <linearGradient id="laravel-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="50%" stop-color="#FF6B4A"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>
  <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>
  <filter id="hero-blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="60"/>
  </filter>
  <filter id="glow-text">
    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
  </pattern>
  <clipPath id="hero-clip">
    <rect width="1200" height="400" rx="20"/>
  </clipPath>
</defs>

<g clip-path="url(#hero-clip)">
  <!-- Solid Background: Ensures black backdrop even in Light Mode -->
  <rect width="1200" height="400" fill="url(#hero-bg)"/>
  
  <!-- Glowing Ambient Spheres -->
  <circle cx="150" cy="80" r="140" fill="#FF2D20" opacity="0.22" filter="url(#hero-blur)"/>
  <circle cx="1050" cy="320" r="160" fill="#00f0ff" opacity="0.18" filter="url(#hero-blur)"/>
  <circle cx="600" cy="360" r="120" fill="#a855f7" opacity="0.15" filter="url(#hero-blur)"/>
  
  <!-- Dot Grid Overlay -->
  <rect width="1200" height="400" fill="url(#dot-grid)"/>

  <!-- Left Side: Profile & Title Info -->
  <!-- Status Pill -->
  <g transform="translate(60, 48)">
    <rect width="260" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#10b981">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Name -->
  <text x="60" y="142" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="58" font-weight="900" fill="url(#laravel-grad)" letter-spacing="1.5" filter="url(#glow-text)">MOULIK SOLANKI</text>

  <!-- Tagline / Title -->
  <text x="62" y="180" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#00f0ff">LARAVEL PHP DEVELOPER · BACKEND ARCHITECT</text>
  
  <text x="62" y="214" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="16" fill="#94a3b8">
    Building high-performance e-governance platforms, RESTful APIs &amp; enterprise ERPs.
  </text>
  <text x="62" y="238" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="16" fill="#94a3b8">
    Specialized in Laravel, CodeIgniter 4, MySQL optimization &amp; AI-assisted development.
  </text>

  <!-- Badges Row -->
  <g transform="translate(60, 276)">
    <!-- Badge 1: Experience -->
    <rect x="0" y="0" width="125" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#FF2D20" stroke-opacity="0.6"/>
    <text x="62" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#FF6B4A">⚡ 4+ YEARS</text>
    
    <!-- Badge 2: Stack -->
    <rect x="135" y="0" width="165" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#00f0ff" stroke-opacity="0.6"/>
    <text x="217" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#00f0ff">🐘 LARAVEL &amp; CI4</text>
    
    <!-- Badge 3: MCA -->
    <rect x="310" y="0" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="395" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#c084fc">🎓 MCA GRADUATE</text>
    
    <!-- Badge 4: Location -->
    <rect x="490" y="0" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="580" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#7dd3fc">📍 DAMAN · INDIA</text>
  </g>

  <!-- Fast Highlights -->
  <g transform="translate(60, 345)">
    <circle cx="6" cy="6" r="3.5" fill="#FF2D20"/>
    <text x="20" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#cbd5e1">10+ Production Projects</text>
    
    <circle cx="230" cy="6" r="3.5" fill="#00f0ff"/>
    <text x="244" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#cbd5e1">MySQL Query Optimization</text>
    
    <circle cx="485" cy="6" r="3.5" fill="#10b981"/>
    <text x="499" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#cbd5e1">Razorpay &amp; Govt APIs</text>
  </g>

  <!-- Right Side: Custom Laravel Artisan Code Terminal -->
  <g transform="translate(730, 48)">
    <!-- Terminal Window Container -->
    <rect width="410" height="304" rx="14" fill="#030712" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="410" height="38" rx="14" fill="#0b1120"/>
    <!-- Window buttons -->
    <circle cx="22" cy="19" r="6" fill="#ef4444"/>
    <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="19" r="6" fill="#10b981"/>
    <text x="205" y="24" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#64748b">moulik@artisan: ~/backend</text>

    <!-- Terminal Code / Commands -->
    <g transform="translate(20, 68)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      <text y="0"><tspan fill="#FF2D20">❯ </tspan><tspan fill="#e2e8f0">php artisan developer:inspect</tspan></text>
      
      <text y="32" fill="#64748b">[System Info: Initialized]</text>
      
      <text y="64"><tspan fill="#38bdf8">Framework :</tspan> <tspan fill="#f1f5f9">Laravel 12 · CodeIgniter 4</tspan></text>
      <text y="92"><tspan fill="#38bdf8">Database  :</tspan> <tspan fill="#f1f5f9">MySQL (Schema + Indexing)</tspan></text>
      <text y="120"><tspan fill="#38bdf8">Workflow  :</tspan> <tspan fill="#f1f5f9">AI Vibe Coding (Claude/GPT)</tspan></text>
      <text y="148"><tspan fill="#38bdf8">Security  :</tspan> <tspan fill="#f1f5f9">Sanctum · CSRF/SQLi Shields</tspan></text>
      <text y="176"><tspan fill="#38bdf8">Delivery  :</tspan> <tspan fill="#10b981">60% Faster Feature Cycles</tspan></text>
      
      <text y="210"><tspan fill="#FF2D20">❯ </tspan><tspan fill="#10b981">✓ Status: Ready to Deploy</tspan><tspan fill="#00f0ff"> █</tspan></text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="url(#border-grad)" stroke-width="1.8" stroke-opacity="0.45"/>
</g>
</svg>