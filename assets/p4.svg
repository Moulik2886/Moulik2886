<svg xmlns="http://www.w3.org/2000/svg" width="580" height="256" viewBox="0 0 580 256" role="img" aria-label="Employment Exchange Job-Matching Platform">
<defs>
  <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050712"/>
    <stop offset="100%" stop-color="#0a0f22"/>
  </linearGradient>
  <linearGradient id="p4-accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#ef4444"/>
  </linearGradient>
  <linearGradient id="p4-shimmer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="p4-clip">
    <rect width="580" height="256" rx="16"/>
  </clipPath>
</defs>

<g clip-path="url(#p4-clip)">
  <rect width="580" height="256" fill="url(#p4-bg)"/>
  
  <circle cx="530" cy="40" r="100" fill="#f59e0b" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  
  <text x="548" y="70" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="900" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5">04</text>
  <text x="28" y="50" font-family="'Segoe UI', -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Employment Exchange Portal</text>
  <text x="28" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#f59e0b">JOB-MATCHING PLATFORM · APPLICANT &amp; EMPLOYER WORKFLOWS</text>
  
  <line x1="28" y1="90" x2="552" y2="90" stroke="url(#p4-accent)" stroke-width="1.8" stroke-opacity="0.7"/>

  <g transform="translate(28, 118)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#cbd5e1">
    <text y="0"><tspan fill="#f59e0b" font-weight="bold">▸</tspan> Dual portal for verified employers &amp; job applicants</text>
    <text y="28"><tspan fill="#f59e0b" font-weight="bold">▸</tspan> Multi-parameter skill &amp; qualification search algorithms</text>
    <text y="56"><tspan fill="#f59e0b" font-weight="bold">▸</tspan> Automated vacancy notifications &amp; live interview tracking</text>
  </g>

  <g transform="translate(28, 204)">
    <rect x="0" y="0" width="65" height="26" rx="13" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="32" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbbf24">PHP</text>

    <rect x="75" y="0" width="75" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="112" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">MySQL</text>

    <rect x="160" y="0" width="105" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="212" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">REST APIs</text>

    <rect x="275" y="0" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#475569" stroke-width="0.8"/>
    <text x="322" y="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">Bootstrap</text>
  </g>

  <!-- Shimmer Beam -->
  <rect x="-200" y="0" width="120" height="256" fill="url(#p4-shimmer)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;750;750" keyTimes="0;.4;1" dur="7s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="578" height="254" rx="15" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="100 900">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" begin="0.6s" repeatCount="indefinite"/>
</rect>
</svg>