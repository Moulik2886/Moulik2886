<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Contact and Collaboration Footer">
<defs>
  <linearGradient id="footer-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#04060e"/>
    <stop offset="50%" stop-color="#050814"/>
    <stop offset="100%" stop-color="#070c1a"/>
  </linearGradient>
  <linearGradient id="footer-text" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="50%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <linearGradient id="wave-grad1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
    <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="wave-grad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.12"/>
    <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.08"/>
  </linearGradient>
  <clipPath id="footer-clip">
    <rect width="1200" height="260" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#footer-clip)">
  <!-- Solid Black Background -->
  <rect width="1200" height="260" fill="url(#footer-bg)"/>
  
  <!-- Twinkling Particle Starfield -->
  <circle cx="120" cy="45" r="1.5" fill="#fff" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="80" r="2" fill="#00f0ff" opacity="0.4">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="35" r="1.2" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="65" r="1.8" fill="#FF2D20" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="40" r="1.4" fill="#10b981" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="75" r="2" fill="#00f0ff" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.95;0.1" dur="2.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Undulating Animated Ocean Waves at Bottom -->
  <path fill="url(#wave-grad2)" d="M0,225 Q300,210 600,225 T1200,225 L1200,260 L0,260 Z">
    <animate attributeName="d" values="M0,225 Q300,210 600,225 T1200,225 L1200,260 L0,260 Z;M0,225 Q300,240 600,225 T1200,225 L1200,260 L0,260 Z;M0,225 Q300,210 600,225 T1200,225 L1200,260 L0,260 Z" dur="8s" repeatCount="indefinite"/>
  </path>

  <path fill="url(#wave-grad1)" d="M0,232 Q300,245 600,232 T1200,232 L1200,260 L0,260 Z">
    <animate attributeName="d" values="M0,232 Q300,245 600,232 T1200,232 L1200,260 L0,260 Z;M0,232 Q300,218 600,232 T1200,232 L1200,260 L0,260 Z;M0,232 Q300,245 600,232 T1200,232 L1200,260 L0,260 Z" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Ambient Pulsing Glow behind Heading -->
  <ellipse cx="600" cy="70" rx="350" ry="45" fill="#38bdf8" opacity="0.06">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Heading -->
  <text x="600" y="78" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="1" fill="url(#footer-text)">
    LET'S BUILD SOMETHING EXTRAORDINARY
  </text>
  
  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Experienced in scaling Laravel backends, mission-critical e-governance &amp; business platforms.
  </text>

  <!-- Interactive Contact Badges -->
  <g transform="translate(600, 155)">
    <!-- Email Button -->
    <g transform="translate(-290, 0)">
      <rect width="265" height="40" rx="20" fill="#0c1322" stroke="#FF2D20" stroke-opacity="0.8" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="132" y="25" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#f8fafc">
        ✉ solankimoulik18@gmail.com
      </text>
    </g>

    <!-- LinkedIn Button -->
    <g transform="translate(25, 0)">
      <rect width="265" height="40" rx="20" fill="#0c1322" stroke="#00f0ff" stroke-opacity="0.8" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="132" y="25" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8">
        💼 in/moulik-solanki
      </text>
    </g>
  </g>

  <!-- Status Bar -->
  <text x="600" y="235" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#718096">
    IMMEDIATE JOINER · OPEN TO REMOTE &amp; RELOCATION · DAMAN, INDIA
  </text>
</g>

<!-- Animated Running Laser Border -->
<rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
<rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="9s" repeatCount="indefinite"/>
</rect>
</svg>