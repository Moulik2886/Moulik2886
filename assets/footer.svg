<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Contact and Collaboration Footer">
<defs>
  <linearGradient id="footer-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050812"/>
    <stop offset="100%" stop-color="#090e1c"/>
  </linearGradient>
  <linearGradient id="footer-text" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF2D20"/>
    <stop offset="50%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <clipPath id="footer-clip">
    <rect width="1200" height="260" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#footer-clip)">
  <!-- Solid Black Background -->
  <rect width="1200" height="260" fill="url(#footer-bg)"/>
  
  <!-- Subtle ambient particles / dots -->
  <circle cx="200" cy="50" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="850" cy="70" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="1020" cy="40" r="2" fill="#00f0ff" opacity="0.5"/>
  <circle cx="150" cy="180" r="2" fill="#FF2D20" opacity="0.4"/>

  <!-- Heading -->
  <text x="600" y="80" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="url(#footer-text)">
    LET'S BUILD SOMETHING EXTRAORDINARY
  </text>
  
  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Experienced in scaling Laravel backends, mission-critical e-governance &amp; business platforms.
  </text>

  <!-- Interactive Contact Badges -->
  <g transform="translate(600, 165)">
    <!-- Email Button -->
    <g transform="translate(-290, 0)">
      <rect width="260" height="38" rx="19" fill="#1e293b" fill-opacity="0.6" stroke="#FF2D20" stroke-opacity="0.7"/>
      <text x="130" y="24" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#f8fafc">
        ✉ solankimoulik18@gmail.com
      </text>
    </g>

    <!-- LinkedIn Button -->
    <g transform="translate(30, 0)">
      <rect width="260" height="38" rx="19" fill="#1e293b" fill-opacity="0.6" stroke="#00f0ff" stroke-opacity="0.7"/>
      <text x="130" y="24" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8">
        💼 in/moulik-solanki
      </text>
    </g>
  </g>

  <!-- Status Bar -->
  <text x="600" y="232" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748b">
    IMMEDIATE JOINER · OPEN TO REMOTE &amp; RELOCATION · DAMAN, INDIA
  </text>

  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#253248" stroke-width="1.5"/>
</g>
</svg>