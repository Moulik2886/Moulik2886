<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moulik Solanki, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.6" stop-color="#0d1628"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .fade { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    .rise { opacity: 0; animation: rise 0.9s ease forwards; }
    .l1 { animation-delay: 0.8s } .l2 { animation-delay: 1.3s } .l3 { animation-delay: 1.8s }
    .l4 { animation-delay: 2.3s } .l5 { animation-delay: 2.8s } .l6 { animation-delay: 3.3s }
    .l7 { animation-delay: 3.8s } .l8 { animation-delay: 4.3s }
    .cursor { animation: blink 1s steps(1) infinite; }
    .orb1 { animation: float1 9s ease-in-out infinite; }
    .orb2 { animation: float2 11s ease-in-out infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .shine { animation: shine 4s ease-in-out infinite; }
    @keyframes fadeIn { to { opacity: 1 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    @keyframes float1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,25px) } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-45px,-20px) } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
    @keyframes shine { 0%,100% { opacity: 0.25 } 50% { opacity: 0.9 } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- glowing orbs -->
    <circle class="orb1" cx="180" cy="80" r="130" fill="#f59e0b" fill-opacity="0.22" filter="url(#blur)"/>
    <circle class="orb2" cx="1020" cy="290" r="150" fill="#3b82f6" fill-opacity="0.25" filter="url(#blur)"/>

    <!-- left: identity -->
    <g class="rise" style="animation-delay:0.1s">
      <text x="64" y="78" class="mono" font-size="15" fill="#fbbf24" letter-spacing="2">&lt;HelloWorld /&gt;</text>
    </g>
    <g class="rise" style="animation-delay:0.25s">
      <text x="62" y="146" class="sans" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1">MOULIK</text>
      <text x="62" y="212" class="sans" font-size="66" font-weight="800" fill="url(#gold)" letter-spacing="-1">SOLANKI</text>
    </g>
    <g class="rise" style="animation-delay:0.45s">
      <text x="64" y="248" class="sans" font-size="24" fill="#cbd5e1" font-weight="500">Full Stack Developer</text>
      <text x="64" y="276" class="mono" font-size="14" fill="#64748b">Laravel  ·  CodeIgniter  ·  PHP  ·  MySQL  ·  JavaScript</text>
    </g>
    <rect x="64" y="294" width="300" height="2" fill="url(#line)" class="shine"/>

    <!-- status pill -->
    <g class="fade" style="animation-delay:1s">
      <rect x="64" y="304" width="206" height="26" rx="13" fill="#0f2a1d" stroke="#16a34a" stroke-opacity="0.6"/>
      <circle class="dot" cx="84" cy="317" r="5" fill="#22c55e"/>
      <text x="98" y="322" class="sans" font-size="12.5" fill="#86efac" font-weight="600">OPEN TO WORK · IMMEDIATE JOINER</text>
    </g>

    <!-- right: code window -->
    <g class="rise" style="animation-delay:0.6s">
      <rect x="690" y="38" width="460" height="264" rx="14" fill="#0b1324" stroke="#1e2d4a"/>
      <rect x="690" y="38" width="460" height="38" rx="14" fill="#101b33"/>
      <rect x="690" y="62" width="460" height="14" fill="#101b33"/>
      <circle cx="714" cy="57" r="6" fill="#ef4444"/>
      <circle cx="734" cy="57" r="6" fill="#fbbf24"/>
      <circle cx="754" cy="57" r="6" fill="#22c55e"/>
      <text x="920" y="61" class="mono" font-size="12" fill="#64748b" text-anchor="middle">Developer.php</text>
    </g>

    <g class="mono" font-size="14.5">
      <text x="714" y="108" class="fade l1"><tspan fill="#c084fc">class</tspan> <tspan fill="#fbbf24">Developer</tspan> <tspan fill="#c084fc">extends</tspan> <tspan fill="#38bdf8">Moulik</tspan> {</text>
      <text x="738" y="136" class="fade l2"><tspan fill="#c084fc">public</tspan> <tspan fill="#e2e8f0">$role</tspan>  <tspan fill="#94a3b8">=</tspan> <tspan fill="#86efac">'Full Stack'</tspan>;</text>
      <text x="738" y="162" class="fade l3"><tspan fill="#c084fc">public</tspan> <tspan fill="#e2e8f0">$exp</tspan>   <tspan fill="#94a3b8">=</tspan> <tspan fill="#fb923c">4</tspan>; <tspan fill="#475569">// years</tspan></text>
      <text x="738" y="188" class="fade l4"><tspan fill="#c084fc">public</tspan> <tspan fill="#e2e8f0">$stack</tspan> <tspan fill="#94a3b8">=</tspan> [<tspan fill="#86efac">'Laravel'</tspan>, <tspan fill="#86efac">'MySQL'</tspan>];</text>
      <text x="738" y="226" class="fade l5"><tspan fill="#c084fc">public function</tspan> <tspan fill="#60a5fa">build</tspan>() {</text>
      <text x="762" y="252" class="fade l6"><tspan fill="#c084fc">return</tspan> <tspan fill="#e2e8f0">$this</tspan>-&gt;<tspan fill="#60a5fa">secure</tspan>()-&gt;<tspan fill="#60a5fa">scale</tspan>();</text>
      <text x="738" y="278" class="fade l7">}</text>
      <text x="714" y="296" class="fade l8">}<tspan class="cursor" fill="#fbbf24"> ▌</tspan></text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" stroke="#1e2d4a"/>
</svg>
